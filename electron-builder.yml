appId: org.iblokz.ide
productName: iBloKz IDE
copyright: Copyright © iBloKz

directories:
  output: artifacts/electron
  buildResources: build/assets

files:
  - electron/**/*
  - dist/**/*
  - build/assets/icons/**/*
  - src/app/util/file-tree.js
  - package.json

asar: true

# Artifact upload is handled by GitHub Actions (native.yml), not electron-builder.
publish: null

linux:
  target:
    - AppImage
  category: Development
  icon: build/assets/icons/icon-512.png
  artifactName: ${name}-${version}-linux-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  # Prefer iconutil-generated .icns (assets.sh); PNG fallback is electron-builder conversion.
  icon: build/assets/icons/icon.icns
  # Electron 33 requires macOS 11+ (Big Sur). Yosemite / older hosts are out of range.
  minimumSystemVersion: '11.0'
  artifactName: ${name}-${version}-macos-${arch}.${ext}

win:
  target:
    - nsis
  icon: build/assets/icons/icon.ico
