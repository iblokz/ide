# Bundled defaults for Electron user settings.
# On first run a copy is written to userData (edit that file, not this one):
#   Linux:   ~/.config/iblokz-ide/settings.yml
#   macOS:   ~/Library/Application Support/iblokz-ide/settings.yml
#   Windows: %APPDATA%\iblokz-ide\settings.yml
#
# Keep this file small — only prefs the main process must know before the window opens.
# Theme / recent projects stay in renderer localStorage (see docs/storage.md).

windows:
  # true  — second launch focuses the existing window (requestSingleInstanceLock)
  # false — each launch may open another window (pre-1.14 behavior)
  singleInstance: false

# Editor prefs (loaded into the renderer via getSettings; edit + restart).
# Cap / web use the same hardcoded defaults when Electron settings are unavailable.
editor:
  # true  — single-click / Mod+P open a reusable audition (preview) tab
  # false — every open is permanent (pinned)
  enablePreview: true
  # When enablePreview is true, Mod+P uses audition; set false to always pin from Quick Open
  enablePreviewFromQuickOpen: true
  # Where to insert a new audition when none exists: right | left | first | last
  openPositioning: right
